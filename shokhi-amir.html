<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>یه پیام برای امیر 😈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #111827; color: #f9fafb;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 430px); padding: 30px 22px; text-align: center;
      background: #1f2937; border: 1px solid #374151; border-radius: 24px;
      box-shadow: 0 18px 50px #0006;
    }
    .warning { color: #f87171; font-size: 18px; font-weight: bold; }
    h1 { color: #facc15; font-size: 38px; margin: 18px 0; }
    .message { font-size: 22px; line-height: 1.8; }
    button {
      margin-top: 24px; border: 0; border-radius: 14px; padding: 14px 24px;
      background: #22c55e; color: #052e16; font-size: 17px;
      font-weight: bold; cursor: pointer;
    }
    #reveal { display: none; margin-top: 22px; color: #86efac; font-size: 21px; line-height: 1.8; }
    .small { color: #9ca3af; font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="warning">⚠️ پیام ویژه سیستم</div>
    <h1>امیر! 😈</h1>
    <div class="message">در حال بررسی میزان شیطنت صاحب گوشی...</div>
    <button id="revealButton" type="button" onclick="document.getElementById('reveal').style.display='block'; this.style.display='none';">
      نتیجه رو نشون بده
    </button>
    <div id="reveal">😂 گول خوردی امیر جان!<br>این فقط یه شوخی بود؛ گوشی‌ات کاملاً امنه.</div>
    <div class="small">این صفحه فقط یک شوخی نمایشی است و هیچ اطلاعاتی جمع‌آوری نمی‌کند.</div>
  </main>
</body>
</html>
